# Include this inside the FlowTrack Nginx server block.
# It does not change authentication or application routing.

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

# Laravel accepts documents up to 20 MB. Keep the reverse proxy safely above
# that boundary so Laravel can return useful validation errors instead of 413.
client_max_body_size 25m;
client_body_timeout 120s;

location ^~ /build/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    try_files $uri =404;
}

location ^~ /flowtrack/modules/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    try_files $uri =404;
}

location = /flowtrack-dynamic.js {
    expires 7d;
    add_header Cache-Control "public" always;
    try_files $uri =404;
}

location ^~ /js/dist/ {
    expires 30d;
    add_header Cache-Control "public, immutable" always;
    try_files $uri =404;
}

location ^~ /css/ {
    expires 30d;
    add_header Cache-Control "public" always;
    try_files $uri =404;
}

location ^~ /images/ {
    expires 30d;
    add_header Cache-Control "public" always;
    try_files $uri =404;
}
