[program:flowtrack-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/flowtrack/artisan queue:work redis --queue=notifications,default --sleep=1 --tries=3 --timeout=90 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/flowtrack/storage/logs/worker.log
stopwaitsecs=120
